<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Agenda de Contatos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Agenda de Contatos</h1>
            <nav>
                <a href="{{ url_for('contacts.index') }}">Início</a>
                <a href="{{ url_for('contacts.cadastrar') }}">Cadastrar</a>
                <a href="{{ url_for('contacts.buscar') }}">Buscar</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
