{% extends "base.html" %}
{% block titulo %}Cadastrar contato{% endblock %}
{% block conteudo %}
<section class="formulario-card">
    <h2>Novo contato</h2>
    <p>Preencha os dados para adicionar uma pessoa à agenda.</p>

    <form action="{{ url_for('contacts.cadastrar') }}" method="POST">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

        <label for="grupo">Grupo</label>
        <select id="grupo" name="grupo" required>
            <option value="">Selecione um grupo</option>
            <option value="Família">Família</option>
            <option value="Amigos">Amigos</option>
            <option value="Trabalho">Trabalho</option>
            <option value="Estudos">Estudos</option>
            <option value="Outros">Outros</option>
        </select>

        <button class="botao" type="submit">Salvar contato</button>
        <a class="link-voltar" href="{{ url_for('contacts.index') }}">Voltar para a agenda</a>
    </form>
</section>
{% endblock %}
