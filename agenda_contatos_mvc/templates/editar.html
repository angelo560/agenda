{% extends "base.html" %}
{% block titulo %}Editar contato{% endblock %}
{% block conteudo %}
<section class="formulario-card">
    <h2>Editar contato</h2>
    <p>Altere os dados e salve as modificações.</p>

    <form action="{{ url_for('contacts.editar', contact_id=contato.id) }}" method="POST">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="{{ contato.name }}" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" value="{{ contato.phone }}" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ contato.email }}" required>

        <label for="grupo">Grupo</label>
        <select id="grupo" name="grupo" required>
            {% for nome_grupo in ["Família", "Amigos", "Trabalho", "Estudos", "Outros"] %}
                <option value="{{ nome_grupo }}" {% if contato.group == nome_grupo %}selected{% endif %}>
                    {{ nome_grupo }}
                </option>
            {% endfor %}
            {% if contato.group not in ["Família", "Amigos", "Trabalho", "Estudos", "Outros"] %}
                <option value="{{ contato.group }}" selected>{{ contato.group }}</option>
            {% endif %}
        </select>

        <button class="botao" type="submit">Salvar alterações</button>
        <a class="link-voltar" href="{{ url_for('contacts.index') }}">Cancelar</a>
    </form>
</section>
{% endblock %}
